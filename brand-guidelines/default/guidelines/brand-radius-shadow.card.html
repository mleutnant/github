<!-- @dsCard group="Brand" viewport="700x200" name="Ecken, Rahmen, Schatten" subtitle="Radius 0 everywhere; shadow only for web cards" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-core)}.row{display:flex;gap:16px;align-items:center}.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-muted)}</style></head><body><div class="row" style="gap:16px;align-items:stretch">
<div style="flex:1;border:1px solid var(--sch-grey-10);padding:18px;font-size:12px"><div class="lbl">Radius</div><div style="margin-top:10px;height:44px;background:var(--sch-blue);border-radius:0"></div><div class="mono" style="margin-top:8px">--radius 0px</div></div>
<div style="flex:1;border:1px solid var(--sch-grey-10);padding:18px;font-size:12px"><div class="lbl">Rahmen</div><div style="margin-top:10px;height:44px;border:6px solid var(--sch-red)"></div><div class="mono" style="margin-top:8px">--frame-weight 6px</div></div>
<div style="flex:1;padding:18px;font-size:12px;box-shadow:var(--shadow-card)"><div class="lbl">Schatten</div><div style="margin-top:10px;height:44px;background:var(--sch-white);box-shadow:var(--shadow-raised)"></div><div class="mono" style="margin-top:8px">--shadow-card / raised</div></div>
</div></body></html>
