<script>window.SCHMIDT_ASSET_BASE='../../assets'</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</head><body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, RadioGroup } = window.SCHMIDTDesignSystem_b5cc27;

function Demo(){
  const [v,setV]=React.useState('gedruckt');
  const [ok,setOk]=React.useState(true);
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24,alignItems:'start'}}>
      <div style={{display:'flex',flexDirection:'column',gap:16}}>
        <Input label="Firma" placeholder="Musterbau GmbH" required/>
        <Input label="E-Mail-Adresse" type="email" value="m.mueller@" error="Bitte prüfen Sie die Adresse."/>
        <Input label="Telefon" type="tel" hint="Optional" disabled/>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:18}}>
        <Select label="System" options={['QuinLine® 74','QuinLine® 84']}/>
        <RadioGroup name="format" legend="Format" inline value={v} onChange={e=>setV(e.target.value)} options={['gedruckt','PDF-Datei']}/>
        <Checkbox label="Produktbroschüre als PDF-Datei" checked={ok} onChange={e=>setOk(e.target.checked)}/>
        <Checkbox label="Nicht ausgewählt" checked={false}/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
