<!-- QuinLine® 74 Edge – Glasleisten-Sortiment. Für einen WordPress-Block „Individuelles HTML“ (Custom HTML).
     Gleicher Stil wie die Systemdaten-Tabelle: Schriftart, -größe und Zeilenabstand kommen vom Theme; Text schwarz, feine graue Trennlinien. -->
<style>
table.sch-glas{width:100%;border-collapse:collapse;border:0;margin:0 0 1.5em;font:inherit;color:inherit;background:none}
table.sch-glas caption{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
table.sch-glas tr,table.sch-glas th,table.sch-glas td{background:none}
table.sch-glas th,table.sch-glas td{font-family:inherit;font-size:inherit;line-height:inherit;padding:12px 0;border:0;border-bottom:1px solid #d0d7db;text-align:left;vertical-align:top;color:#000000}
table.sch-glas th{width:34%;padding-right:16px;font-weight:700}
table.sch-glas td{font-weight:400}
table.sch-glas thead th{padding-top:0;border-bottom:2px solid #000000}
table.sch-glas thead th+th{width:auto}
</style>
<table class="sch-glas">
  <caption>Glasleisten-Sortiment der QuinLine® 74 Edge</caption>
  <thead>
    <tr><th scope="col">Glasdicke</th><th scope="col">Verfügbarkeit</th></tr>
  </thead>
  <tbody>
    <tr><th scope="row">20–27&nbsp;mm</th><td>auftragsbezogen</td></tr>
    <tr><th scope="row">28–31&nbsp;mm</th><td>weiß ab Lager, Dekor auftragsbezogen</td></tr>
    <tr><th scope="row">32–35&nbsp;mm</th><td>auftragsbezogen</td></tr>
    <tr><th scope="row">36–50&nbsp;mm</th><td>ab Lager</td></tr>
  </tbody>
</table>
