<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-core)}.row{display:flex;gap:16px;align-items:stretch}.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-muted)}</style></head><body><div style="display:flex;align-items:baseline;gap:16px;padding:4px 0;border-bottom:1px solid var(--sch-grey-10)"><div class="mono" style="flex:0 0 150px">--fs-display</div><div class="mono" style="flex:0 0 48px">72px</div><div style="font-size:72px;font-weight:700;line-height:1.15;color:var(--text-heading);white-space:nowrap;overflow:hidden">Heben. Schieben.</div></div><div style="display:flex;align-items:baseline;gap:16px;padding:4px 0;border-bottom:1px solid var(--sch-grey-10)"><div class="mono" style="flex:0 0 150px">--fs-h1</div><div class="mono" style="flex:0 0 48px">44px</div><div style="font-size:44px;font-weight:700;line-height:1.15;color:var(--text-heading);white-space:nowrap;overflow:hidden">Die Hebeschiebetür</div></div><div style="display:flex;align-items:baseline;gap:16px;padding:4px 0;border-bottom:1px solid var(--sch-grey-10)"><div class="mono" style="flex:0 0 150px">--fs-h2</div><div class="mono" style="flex:0 0 48px">32px</div><div style="font-size:32px;font-weight:700;line-height:1.15;color:var(--text-heading);white-space:nowrap;overflow:hidden">Das System QuinLine®</div></div><div style="display:flex;align-items:baseline;gap:16px;padding:4px 0;border-bottom:1px solid var(--sch-grey-10)"><div class="mono" style="flex:0 0 150px">--fs-h3</div><div class="mono" style="flex:0 0 48px">24px</div><div style="font-size:24px;font-weight:700;line-height:1.15;color:var(--text-heading);white-space:nowrap;overflow:hidden">Die Welt der Schwellen</div></div><div style="display:flex;align-items:baseline;gap:16px;padding:4px 0;border-bottom:1px solid var(--sch-grey-10)"><div class="mono" style="flex:0 0 150px">--fs-body</div><div class="mono" style="flex:0 0 48px">17px</div><div style="font-size:17px;font-weight:500;line-height:1.15;color:var(--text-heading);white-space:nowrap;overflow:hidden">Fließtext in Medium</div></div><div style="display:flex;align-items:baseline;gap:16px;padding:4px 0;border-bottom:1px solid var(--sch-grey-10)"><div class="mono" style="flex:0 0 150px">--fs-side</div><div class="mono" style="flex:0 0 48px">15px</div><div style="font-size:15px;font-weight:400;line-height:1.15;color:var(--text-heading);white-space:nowrap;overflow:hidden">Randspalte in Regular</div></div><div style="display:flex;align-items:baseline;gap:16px;padding:4px 0;border-bottom:1px solid var(--sch-grey-10)"><div class="mono" style="flex:0 0 150px">--fs-caption</div><div class="mono" style="flex:0 0 48px">13px</div><div style="font-size:13px;font-weight:500;line-height:1.15;color:var(--text-heading);white-space:nowrap;overflow:hidden">Icon Unterzeile</div></div><div style="display:flex;align-items:baseline;gap:16px;padding:4px 0;border-bottom:1px solid var(--sch-grey-10)"><div class="mono" style="flex:0 0 150px">--fs-eyebrow</div><div class="mono" style="flex:0 0 48px">12px</div><div style="font-size:12px;font-weight:700;line-height:1.15;color:var(--text-heading);white-space:nowrap;overflow:hidden">EYEBROW</div></div></body></html>
