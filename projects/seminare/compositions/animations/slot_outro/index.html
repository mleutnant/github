<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Filson Pro";
        src: url("assets/fonts/FilsonProBold.otf") format("opentype");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Filson Pro";
        src: url("assets/fonts/FilsonProMedium.otf") format("opentype");
        font-weight: 500;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Filson Pro";
        src: url("assets/fonts/FilsonProRegular.otf") format("opentype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #123442;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: #123442;
        font-family: "Filson Pro", Arial, Helvetica, sans-serif;
      }

      #logo {
        position: absolute;
        top: 96px;
        left: 64px;
        width: 340px;
        height: auto;
        opacity: 0;
      }

      #headline {
        position: absolute;
        top: 700px;
        left: 64px;
        width: 85%;
        max-width: 85%;
        color: #ffffff;
        font-family: "Filson Pro", Arial, Helvetica, sans-serif;
        font-weight: 700;
        font-size: 76px;
        line-height: 1.15;
        text-align: left;
        opacity: 0;
      }

      #rule {
        position: absolute;
        left: 64px;
        top: 880px;
        width: 120px;
        height: 8px;
        background: #f6a206;
        border-radius: 0;
        transform-origin: left center;
      }

      #subhead {
        position: absolute;
        left: 64px;
        top: 968px;
        width: 85%;
        max-width: 85%;
        color: rgba(255, 255, 255, 0.85);
        font-family: "Filson Pro", Arial, Helvetica, sans-serif;
        font-weight: 500;
        font-size: 34px;
        line-height: 1.5;
        text-align: left;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="2.5"
      data-width="1080"
      data-height="1920"
    >
      <img
        id="logo"
        class="clip"
        src="assets/logo-schmidt-negative.svg"
        alt="SCHMIDT"
        data-start="0"
        data-duration="2.5"
        data-track-index="0"
      />
      <h1
        id="headline"
        class="clip"
        data-start="0"
        data-duration="2.5"
        data-track-index="1"
      >
        Seminare im November
      </h1>
      <div
        id="rule"
        class="clip"
        data-start="0"
        data-duration="2.5"
        data-track-index="2"
      ></div>
      <p
        id="subhead"
        class="clip"
        data-start="0"
        data-duration="2.5"
        data-track-index="3"
      >
        QuinLine&reg; 74 | 84 &ndash; Auffrischung, Vertiefung &amp; Montage-Sicherheit
      </p>
    </div>
    <script>
      document.fonts.ready.then(() => {
        // --- Dynamic layout: position the rule bar and subhead relative to
        // the headline's actual rendered height (headline may wrap to one
        // or two lines depending on font metrics). Measured once via the
        // deterministic text-measurement helper (no DOM reflow dependency).
        const HEADLINE_TOP = 700;
        const HEADLINE_FONT_SIZE = 76;
        const HEADLINE_LINE_HEIGHT = HEADLINE_FONT_SIZE * 1.15;
        const CONTENT_MAX_WIDTH = 1080 * 0.85;
        const RULE_HEIGHT = 8;
        const GAP = 40;

        let headlineHeight = HEADLINE_LINE_HEIGHT; // sane fallback: 1 line
        try {
          const font = `700 ${HEADLINE_FONT_SIZE}px "Filson Pro"`;
          const prepared = window.__hyperframes.pretext.prepare(
            "Seminare im November",
            font
          );
          const layout = window.__hyperframes.pretext.layout(
            prepared,
            CONTENT_MAX_WIDTH,
            HEADLINE_LINE_HEIGHT
          );
          headlineHeight = layout.height;
        } catch (e) {
          // keep fallback
        }

        const ruleTop = HEADLINE_TOP + headlineHeight + GAP;
        const subheadTop = ruleTop + RULE_HEIGHT + GAP;

        document.getElementById("rule").style.top = ruleTop + "px";
        document.getElementById("subhead").style.top = subheadTop + "px";

        const tl = gsap.timeline({ paused: true });

        // Logo fade-in: 0.00 - 0.35s
        tl.fromTo(
          "#logo",
          { opacity: 0 },
          { opacity: 1, duration: 0.35, ease: "power3.out" },
          0
        );

        // Headline fade + slide up: 0.25 - 0.70s
        tl.fromTo(
          "#headline",
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" },
          0.25
        );

        // Yellow rule draws from 0 to full width: 0.70 - 0.95s
        tl.fromTo(
          "#rule",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.25, ease: "sine.inOut" },
          0.7
        );

        // Subhead fade + slight slide up: 0.85 - 1.25s
        tl.fromTo(
          "#subhead",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          0.85
        );

        // Hold static from 1.25s to 2.50s (no further tweens)

        window.__timelines["main"] = tl;
        tl.seek(0);
      });
    </script>
  </body>
</html>
