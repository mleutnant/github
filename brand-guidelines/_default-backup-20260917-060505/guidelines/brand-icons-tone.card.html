<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-core)}.row{display:flex;gap:16px;align-items:center}.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-muted)}</style></head><body><div class="row" style="gap:14px;align-items:stretch">
<div style="flex:1;border:1px solid var(--sch-grey-10);padding:20px;display:grid;place-items:center"><img src="../assets/icons/sicherheit.png" style="width:48px"></div>
<div style="flex:1;background:var(--sch-blue);padding:20px;display:grid;place-items:center"><img src="../assets/icons/sicherheit.png" style="width:48px;filter:brightness(0) invert(1)"></div>
<div style="flex:1;border:1px solid var(--sch-grey-10);padding:20px;display:grid;place-items:center"><span style="width:48px;height:48px;background:var(--sch-red);-webkit-mask:url(../assets/icons/sicherheit.png) center/contain no-repeat;mask:url(../assets/icons/sicherheit.png) center/contain no-repeat"></span></div>
</div><div class="row" style="margin-top:8px;gap:14px"><div style="flex:1" class="lbl">Schwarz auf Weiß</div><div style="flex:1" class="lbl">Weiß auf Blau</div><div style="flex:1" class="lbl">Rot — nur Webseite</div></div></body></html>
