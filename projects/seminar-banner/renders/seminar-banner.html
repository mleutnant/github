<!--
  SCHMIDT Seminar-Banner
  Kompletter Baustein zum Einfügen in ein HTML-Element der Website.

  BEARBEITEN (nur die markierten Stellen im unteren Teil ändern):
  1. Bild          -> src="..." und alt="..." am <img>.
                      Ohne Bild: den ganzen <div class="sch-sb__media"> ... </div> löschen.
  2. Überschrift   -> Text im <p class="sch-sb__title">.
  3. Unterzeile    -> Text im <p class="sch-sb__sub">. Ohne Unterzeile: die Zeile löschen.
  4. Button-Text   -> Text im <a class="sch-sb__btn">.
  5. Button-Link   -> href="..." am <a class="sch-sb__btn">.
                      In neuem Tab öffnen: target="_blank" rel="noopener" ergänzen.
  6. Farbe         -> class="sch-sb" = Rot (wie Vorlage)
                      class="sch-sb sch-sb--blau" = Blau mit gelber Unterlinie

  Die Gestaltung (Style-Block direkt unter diesem Kommentar) muss dafür nicht angefasst werden.
  Mehrere Banner auf einer Seite: den Style-Block nur einmal einfügen.
-->
<style>
.sch-sb{
  --sch-sb-bg:#e3002c;
  container-type:inline-size;
  margin:0;
  color:#ffffff;
  font-family:"Filson Pro","filson-pro",Arial,Helvetica,sans-serif;
}
.sch-sb--blau{--sch-sb-bg:#123442}
.sch-sb *,.sch-sb *::before,.sch-sb *::after{box-sizing:border-box}

.sch-sb .sch-sb__inner{
  display:flex;
  align-items:stretch;
  min-height:96px;
  background:var(--sch-sb-bg);
}
/* Blaue Flächen schließen laut Guideline mit einer gelben Unterlinie */
.sch-sb--blau .sch-sb__inner{border-bottom:8px solid #f6a206}

.sch-sb .sch-sb__media{
  position:relative;
  flex:0 0 192px;
  overflow:hidden;
  background:#123442;
}
.sch-sb .sch-sb__media img{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  max-width:none;
  margin:0;
  object-fit:cover;
}

.sch-sb .sch-sb__body{
  display:flex;
  flex:1 1 auto;
  align-items:center;
  justify-content:space-between;
  gap:16px 40px;
  min-width:0;
  padding:20px 24px 20px 48px;
}
.sch-sb .sch-sb__text{min-width:0;overflow-wrap:break-word}
.sch-sb p.sch-sb__title,
.sch-sb p.sch-sb__sub{
  margin:0;
  padding:0;
  color:#ffffff;
  font-family:inherit;
  font-size:20px;
  line-height:1.3;
  letter-spacing:0;
}
.sch-sb p.sch-sb__title{font-weight:700}
.sch-sb p.sch-sb__sub{font-weight:400;hyphens:auto;-webkit-hyphens:auto}

/* Button: weißer Rahmen mit Bruch unten rechts, wie die Bildmarke */
.sch-sb a.sch-sb__btn,
.sch-sb a.sch-sb__btn:visited{
  position:relative;
  flex:0 0 auto;
  display:inline-block;
  margin:0 4px 2px 0;
  padding:13px 28px 13px 30px;
  border:2px solid #ffffff;
  border-right:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
  color:#ffffff;
  font-family:inherit;
  font-size:18px;
  font-weight:700;
  line-height:1.15;
  text-decoration:none;
  white-space:nowrap;
  cursor:pointer;
  transition:background-color 180ms cubic-bezier(.2,.6,.2,1),color 180ms cubic-bezier(.2,.6,.2,1);
}
.sch-sb a.sch-sb__btn::after{
  content:"";
  position:absolute;
  top:-2px;
  right:-4px;
  bottom:-4px;
  width:4px;
  border-top:2px solid #ffffff;
  border-right:2px solid #ffffff;
  pointer-events:none;
}
.sch-sb a.sch-sb__btn:hover,
.sch-sb a.sch-sb__btn:focus-visible{
  background:#ffffff;
  color:var(--sch-sb-bg);
  text-decoration:none;
}
.sch-sb a.sch-sb__btn:focus-visible{outline:3px solid #f6a206;outline-offset:2px}
.sch-sb a.sch-sb__btn:active{transform:translateY(1px)}

@media (prefers-reduced-motion:reduce){
  .sch-sb a.sch-sb__btn{transition:none}
}

/* Schmale Spalten und Smartphone: richtet sich nach der Breite des Banners, nicht des Fensters */
@container (max-width:900px){
  .sch-sb .sch-sb__media{flex-basis:140px}
  .sch-sb .sch-sb__body{gap:16px 24px;padding-left:32px}
}
@container (max-width:640px){
  .sch-sb .sch-sb__media{display:none}
  .sch-sb .sch-sb__body{flex-direction:column;align-items:flex-start;padding:20px 20px 24px}
  .sch-sb p.sch-sb__title,
  .sch-sb p.sch-sb__sub{font-size:18px}
}
</style>

<div class="sch-sb" lang="de"><!-- BEARBEITEN 6: Farbe -->
  <div class="sch-sb__inner">
    <div class="sch-sb__media">
      <!-- BEARBEITEN 1: Bild -->
      <img src="seminar-foto.jpg" alt="QuinLine-Seminar: Referent erklärt die Technik am Bildschirm" width="400" height="200" loading="lazy">
    </div>
    <div class="sch-sb__body">
      <div class="sch-sb__text">
        <!-- BEARBEITEN 2 und 3: Überschrift und Unterzeile -->
        <p class="sch-sb__title">QuinLine-Seminare für Kaufleute und Monteure</p>
        <p class="sch-sb__sub">Neue Termine für unsere Fensterbaufachbetriebe im November.</p>
      </div>
      <!-- BEARBEITEN 4 und 5: Button-Text und Link -->
      <a class="sch-sb__btn" href="#seminar-anmeldung">Jetzt anmelden</a>
    </div>
  </div>
</div>
