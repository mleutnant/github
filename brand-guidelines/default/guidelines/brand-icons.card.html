<!-- @dsCard group="Brand" viewport="700x330" name="Icon-Set" subtitle="Die 15 SCHMIDT-Icons als SVG, transparent, in currentColor" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-core);color:var(--sch-black)}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:18px 10px}.cell{text-align:center}.ic{width:44px;height:44px;margin:0 auto;background:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}.mono{font-family:ui-monospace,Menlo,monospace;font-size:9px;color:var(--text-muted);margin-top:6px}</style></head><body><div class="grid" id="g"></div><script>const N=['barrierefrei','breite','chat','farbfaecher','groesse','komfort','lautsprecher-aus','regen','renovierung','schloss','sonderausstattung','sonnenschutz','tablet-handy','taschenrechner','thermostat'];document.getElementById('g').innerHTML=N.map(n=>`<div class="cell"><div class="ic" style="-webkit-mask-image:url(../assets/icons/${n}.svg);mask-image:url(../assets/icons/${n}.svg)"></div><div class="mono">${n}</div></div>`).join('');</script></body></html>
