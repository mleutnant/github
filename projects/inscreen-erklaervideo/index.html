<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>InScreen Erklärvideo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/MotionPathPlugin.min.js"></script>
    <script src="assets/vendor/DrawSVGPlugin.min.js"></script>
    <script src="assets/vendor/CustomEase.min.js"></script>
    <script>
      gsap.registerPlugin(MotionPathPlugin, DrawSVGPlugin, CustomEase);
    </script>
    <style>
      @font-face { font-family: "Filson Pro"; src: url("assets/fonts/FilsonProBook.otf") format("opentype"); font-weight: 400; }
      @font-face { font-family: "Filson Pro"; src: url("assets/fonts/FilsonProMedium.otf") format("opentype"); font-weight: 500; }
      @font-face { font-family: "Filson Pro"; src: url("assets/fonts/FilsonProBold.otf") format("opentype"); font-weight: 700; }
      @font-face { font-family: "Filson Pro"; src: url("assets/fonts/FilsonProHeavy.otf") format("opentype"); font-weight: 800; }
      @font-face { font-family: "Filson Pro"; src: url("assets/fonts/FilsonProBlack.otf") format("opentype"); font-weight: 900; }
      :root {
        --sch-blue: #123442; --sch-red: #e3002c; --sch-yellow: #f6a206; --sch-white: #ffffff; --sch-black: #000000;
        --ink: #1d2a31; --cream: #f7f1e6;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--sch-blue); font-family: "Filson Pro", Arial, sans-serif; -webkit-font-smoothing: antialiased; font-kerning: normal; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--sch-blue); }
      #scene { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
      #hud { position: absolute; inset: 0; pointer-events: none; }
      .hud-layer { position: absolute; inset: 0; }
      #grain { position: absolute; inset: -40px; background-image: url("assets/grain.png"); background-size: 512px 512px; opacity: 0.05; mix-blend-mode: multiply; pointer-events: none; }
      #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(18,52,66,0) 62%, rgba(18,52,66,0.22) 100%); }
      /* Typo */
      .t-title { position: absolute; font-weight: 900; color: var(--sch-white); letter-spacing: -0.01em; line-height: 1.02; }
      .t-label { position: absolute; font-weight: 700; color: var(--sch-blue); white-space: nowrap; }
      .t-body { position: absolute; font-weight: 500; color: var(--sch-white); line-height: 1.3; }
      .chip { position: absolute; display: flex; align-items: center; gap: 14px; padding: 14px 26px 14px 22px; background: var(--sch-white); color: var(--sch-blue); font-weight: 800; font-size: 40px; white-space: nowrap; box-shadow: 0 10px 30px rgba(18,52,66,0.18); }
      .chip .bar { width: 6px; height: 40px; background: var(--sch-red); }
      .w { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="inscreen-erklaervideo" data-width="1920" data-height="1080" data-start="0" data-duration="77.267">
      <svg id="scene" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg"><defs></defs></svg>
      <div id="hud"></div>
      <div id="vignette"></div>
      <div id="grain"></div>
      <audio id="mix" data-start="0" data-track-index="2" src="assets/audio/mix.wav" data-volume="1"></audio>
