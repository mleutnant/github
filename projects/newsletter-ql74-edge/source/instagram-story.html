<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Instagram-Story QuinLine® 74 Edge</title>
<!-- Story 1080 × 1920 px zum Teilen des LinkedIn-Newsletters. Freie Fläche unten für den Link-Sticker.
     Oben ca. 220 px und unten ca. 220 px frei lassen: dort liegen Instagram-Bedienelemente. -->
<style>
@font-face{font-family:"Filson Pro";src:url("../../../brand-guidelines/default/assets/fonts/FilsonProMedium.otf") format("opentype");font-weight:500}
@font-face{font-family:"Filson Pro";src:url("../../../brand-guidelines/default/assets/fonts/FilsonProBold.otf") format("opentype");font-weight:700}
:root{--blue:#123442;--red:#e3002c;--yellow:#f6a206;--soft:#e7ebec;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#555;font-family:"Filson Pro",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.story{position:relative;width:1080px;height:1920px;background:var(--blue);color:var(--white);overflow:hidden}
.eyebrow{position:absolute;left:72px;top:250px;font-weight:700;font-size:30px;letter-spacing:.08em;text-transform:uppercase;opacity:.92}
h1{position:absolute;left:72px;top:300px;margin:0;font-weight:700;font-size:100px;line-height:1.04;letter-spacing:-.01em}
.rule{position:absolute;left:72px;top:530px;width:128px;height:8px;background:var(--red)}
.card{position:absolute;left:72px;top:592px;width:936px;height:531px;display:block}
/* Prinzip „Rahmen und Fläche“: gelber Winkel, versetzt zum Bild, mit Lücke am Schnittpunkt */
.frame-v{position:absolute;left:1032px;top:880px;width:10px;height:276px;background:var(--yellow)}
.frame-h{position:absolute;left:560px;top:1146px;width:482px;height:10px;background:var(--yellow)}
ul{position:absolute;left:72px;top:1210px;margin:0;padding:0;list-style:none}
li{position:relative;padding-left:30px;margin:0 0 18px;font-weight:500;font-size:40px;line-height:1.3;color:var(--soft)}
li::before{content:"";position:absolute;left:0;top:.2em;width:4px;height:1.05em;background:var(--white)}
.cta{position:absolute;left:72px;top:1452px;font-weight:700;font-size:46px;line-height:1.2}
.bar{position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--yellow)}
</style>
</head>
<body>
<div class="story" id="story">
  <div class="eyebrow">Neu im LinkedIn-Newsletter</div>
  <h1>Geradlinig bis<br>ins Detail.</h1>
  <div class="rule"></div>
  <img class="card" src="../renders/images/keyvisual-ql74-edge.jpg" alt="QuinLine® 74 Edge">
  <div class="frame-v"></div>
  <div class="frame-h"></div>
  <ul>
    <li>Schmaler Flügelüberschlag, 25 mm</li>
    <li>Kantige Glasleisten</li>
    <li>Glasdicken bis 50 mm</li>
  </ul>
  <div class="cta">Alle Details im Newsletter</div>
  <!-- frei für den Link-Sticker: ca. y 1530–1700 -->
  <div class="bar"></div>
</div>
</body>
</html>
