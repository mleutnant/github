<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>QuinLine Lower Third</title>
    <script src="./assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Filson Pro";
        src: url("./assets/fonts/FilsonProBold.otf") format("opentype");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Filson Pro";
        src: url("./assets/fonts/FilsonProMedium.otf") format("opentype");
        font-weight: 500;
        font-style: normal;
        font-display: block;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      #lt-group {
        position: absolute;
        left: 48px;
        top: 1280px;
        height: 110px;
        display: flex;
        align-items: stretch;
      }

      #lt-rule {
        width: 8px;
        height: 100%;
        background: #f6a206;
        border-radius: 0;
        flex-shrink: 0;
      }

      #lt-chip {
        height: 100%;
        background: #123442;
        border-radius: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 32px;
        white-space: nowrap;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      }

      #lt-text {
        display: inline-block;
        font-family: "Filson Pro", Arial, Helvetica, sans-serif;
        font-weight: 700;
        font-size: 52px;
        line-height: 1;
        color: #ffffff;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="4.5"
    >
      <div class="clip" id="lt-clip" data-start="0" data-duration="4.5">
        <div id="lt-group">
          <div id="lt-rule"></div>
          <div id="lt-chip">
            <span id="lt-text">QuinLine&reg; 74 &amp; 84</span>
          </div>
        </div>
      </div>
    </div>
    <script>
      document.fonts.ready.then(() => {
        const marginLeft = 48;
        const group = document.getElementById("lt-group");
        const totalWidth = group.getBoundingClientRect().width;
        const offscreenX = -(totalWidth + marginLeft);

        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#lt-group",
          { x: offscreenX, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
          0
        );
        tl.to("#lt-group", { opacity: 0, duration: 0.35, ease: "sine.inOut" }, 4.15);

        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
